# Reference coturn (TURN/STUN server) config for CMS_BACKEND WebRTC calls.
#
# WHY YOU NEED THIS:
# STUN alone (stun:stun.l.google.com:19302, the current fallback in
# getIceServers()) only works when both callers can reach each other with a
# direct/hole-punched UDP path. Corporate networks, symmetric NATs, and some
# home routers block that — WebRTC then reports connectionState "failed" and
# that specific pair simply gets no audio/video, while other pairs on more
# permissive networks work fine. This is exactly the "some peers connect,
# some don't" symptom in group calls. A TURN server relays media between
# those peers as a fallback, fixing it for everyone.
#
# INSTALL (Ubuntu/Debian VPS):
#   sudo apt update && sudo apt install -y coturn
#   sudo cp deploy/coturn/turnserver.conf /etc/turnserver.conf
#   sudo nano /etc/turnserver.conf   # fill in realm, external-ip, user, cert paths
#   sudo systemctl enable coturn
#   sudo systemctl restart coturn
#
# FIREWALL (open these — coturn needs raw UDP/TCP, nginx does NOT proxy this):
#   sudo ufw allow 3478/tcp
#   sudo ufw allow 3478/udp
#   sudo ufw allow 5349/tcp
#   sudo ufw allow 5349/udp
#   sudo ufw allow 49160:49200/udp
#
# Then set these in the backend's .env and restart pm2:
#   WEBRTC_TURN_URLS=turn:api.YOURDOMAIN.com:3478,turns:api.YOURDOMAIN.com:5349
#   WEBRTC_TURN_USERNAME=cmschat
#   WEBRTC_TURN_CREDENTIAL=<the same strong password set as `user=` below>
#
# Verify it works (paste your TURN details) at:
#   https://webrtc.github.io/samples/src/content/peerconnection/trickle-ice/

listening-port=3478
tls-listening-port=5349

# Replace with the VPS's public IP (same one api.YOURDOMAIN.com points to)
external-ip=YOUR.VPS.PUBLIC.IP

# Narrow relay port range — must match the firewall rule above
min-port=49160
max-port=49200

# Static long-term credentials (matches WEBRTC_TURN_USERNAME/CREDENTIAL above).
# Pick your own long random password — do not reuse this example.
lt-cred-mech
user=cmschat:CHANGE_ME_TO_A_STRONG_PASSWORD
realm=YOURDOMAIN.com

# TLS (reuse the certbot cert already issued for api.YOURDOMAIN.com)
cert=/etc/letsencrypt/live/api.YOURDOMAIN.com/fullchain.pem
pkey=/etc/letsencrypt/live/api.YOURDOMAIN.com/privkey.pem

fingerprint
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# Don't let coturn relay to internal/private addresses (basic SSRF hardening)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

pidfile=/var/run/turnserver.pid
log-file=/var/log/turnserver.log
simple-log
