# Reference Nginx server block for CMS_BACKEND (Express + Socket.IO)
# Copy to /etc/nginx/sites-available/api.YOURDOMAIN.com and symlink to sites-enabled.
# Replace: api.YOURDOMAIN.com, and the upstream port (matches process.env.PORT).

upstream cms_backend {
    # Node app — keep it bound to localhost, nginx is the only public entrypoint
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.YOURDOMAIN.com;

    # certbot will add its own location + redirect block here after
    # `certbot --nginx -d api.YOURDOMAIN.com`
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.YOURDOMAIN.com;

    # ssl_certificate / ssl_certificate_key are added automatically by certbot

    # --- Required: large chat/document uploads (matches multer 1000mb limit) ---
    # Without this, nginx returns 413 before Express/multer ever see the file.
    client_max_body_size 1000m;

    # --- Required: Socket.IO / WebSocket upgrade ---
    location /socket.io/ {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO pings every 25s (see initSocket pingInterval) — keep timeouts above that
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Chat zip/archives stored on this server (see src/utils/localFileStore.js)
    location /uploads/ {
        alias /var/www/CMS_BACKEND/public/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Normal REST API traffic ---
    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
